name: Weekly FDA data refresh

on:
  schedule:
    - cron: "17 11 * * 1"   # every Monday, 11:17 UTC (7:17 am ET)
  workflow_dispatch:
    inputs:
      full:
        description: "Re-download all history (every year + pre-2012 keyword slices)"
        type: boolean
        default: false

permissions:
  contents: write   # commit refreshed data
  actions: write    # keep the weekly schedule enabled

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # fetch_fda.py keeps the saved data if FDA can't be reached, and only fails
      # when the saved data is more than 45 days old.
      - name: Download latest FDA veterinary recalls
        run: python3 scripts/fetch_fda.py ${{ inputs.full && '--full' || '' }}

      - name: Rebuild dataset, dashboard and README stats
        run: python3 scripts/pipeline.py

      - name: Commit only if the recall data changed
        run: |
          git config user.name "Alana Kwan"
          git config user.email "akwnn@users.noreply.github.com"
          git add data index.html README.md
          if git diff --cached --quiet; then
            echo "No new FDA recall data this week."
            exit 0
          fi
          through=$(grep -o '"data_through":"[0-9-]*"' index.html | head -1 | cut -d'"' -f4)
          git commit -m "Weekly FDA data refresh: data through ${through}"
          git pull --rebase origin main
          git push origin HEAD:main

      # GitHub pauses scheduled workflows in public repos after 60 days without
      # repository activity. Re-enabling through the API keeps the schedule on
      # without making empty commits.
      - name: Keep the weekly schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/refresh.yml/enable" && echo "Schedule is enabled."
